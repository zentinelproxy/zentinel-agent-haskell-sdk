# Build and test the SDK, and prove its agents work behind a real zentinel.
#
# This repository had no CI. Its package did not build at all (unsatisfiable
# dependency bounds), and the test suite, had it built, would have run zero
# examples: hspec-discover only picks up modules named *Spec. Nothing here had
# ever spoken to the proxy (zentinel#600).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GHC_VERSION: "9.8.4"
  CABAL_VERSION: "3.12"

jobs:
  test:
    name: Build and test (GHC ${{ matrix.ghc }}${{ matrix.grpc && '' || ', -f-grpc' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.8.4"]
        grpc: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install snappy and protoc (needed by grapesy and proto-lens for the gRPC transport)
        if: matrix.grpc
        run: sudo apt-get update && sudo apt-get install -y libsnappy-dev protobuf-compiler

      - name: Install GHC and cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Configure
        run: |
          cabal configure --enable-tests ${{ matrix.grpc && '' || '--constraint="zentinel-agent-protocol -grpc"' }}
          cabal build all --dry-run

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.grpc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.grpc }}-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all

  conformance:
    # The SDK's agents behind a real zentinel binary, through the shared
    # harness in zentinelproxy/zentinel (sdk-conformance/): handshake,
    # configure, header mutations, block, body inspection, reconnect, over
    # UDS and gRPC.
    name: Conformance (agent protocol v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install snappy and protoc
        run: sudo apt-get update && sudo apt-get install -y libsnappy-dev protobuf-compiler

      - name: Install GHC and cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Configure
        run: cabal build all --dry-run

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ env.GHC_VERSION }}-true-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-${{ env.GHC_VERSION }}-true-

      - name: Build the agents
        # Built before the harness starts them: it waits at most 120 s for
        # an agent to listen, and starts each twice.
        run: |
          cabal build exe:conformance-agent exe:hello-agent
          mkdir -p bin
          cp "$(cabal list-bin conformance-agent)" bin/
          cp "$(cabal list-bin hello-agent)" bin/

      - name: Conformance agent (UDS + gRPC)
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          # Config delivery (zentinel#603) is not in a release yet. Switch to
          # `zentinel-version: <first release with #603>` once it ships.
          zentinel-ref: main
          agent-command: ./bin/conformance-agent --socket {socket}
          grpc-agent-command: ./bin/conformance-agent --grpc {grpc}

      - name: README quick-start agent
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-ref: main
          profile: hello
          agent-command: ./bin/hello-agent --socket {socket}
